<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인쇄</title>
<style>
  /* 인쇄 시 이미지가 용지를 채우는 방식.
     기본값: cover (여백 없이 꽉 채움, 이미지 일부가 잘릴 수 있음)
     실제 인쇄 테스트 후 이미지가 과하게 잘린다면 아래 값을 contain으로 바꾸세요. */
  :root {
    --print-object-fit: cover; /* cover | contain */
  }

  @page {
    size: 4in 6in;
    margin: 0;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  #print-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: var(--print-object-fit);
  }

  @media print {
    html, body {
      width: 4in;
      height: 6in;
    }

    #print-image {
      width: 4in;
      height: 6in;
    }
  }
</style>
</head>
<body>
  <img id="print-image" alt="">
  <script>
    // 이 문서는 부모 페이지(index.html)의 숨겨진 iframe 안에서 로드된다.
    // 부모는 이 iframe의 onload(=이미지까지 완전히 로드된 시점)를 기다렸다가
    // printFrame.contentWindow.print()를 직접 호출하므로, 여기서는 쿼리스트링의
    // src로 이미지를 표시하는 역할만 하면 된다.
    var src = new URLSearchParams(location.search).get("src");
    if (src) {
      document.getElementById("print-image").src = src;
    }
  </script>
</body>
</html>
