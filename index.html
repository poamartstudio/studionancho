<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>포토 프린트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-512.png">
</head>
<body>

  <div id="home-screen" class="screen">
    <img id="bg-image" src="back2.png" alt="">
    <div id="bg-overlay"></div>
    <div class="home-content">
      <img id="title-image" src="back1.png" alt="가만히, 묻다">
      <button id="draw-btn" type="button" aria-label="뽑기"></button>
      <p id="notice">* 엽서는 1인 1장만 뽑아가주세요.</p>
    </div>
  </div>

  <div id="preview-screen" class="screen hidden">
    <img id="print-image" alt="인쇄할 이미지">
    <div class="button-row">
      <button id="print-btn" type="button">인쇄</button>
      <button id="reset-btn" type="button">처음으로</button>
    </div>
  </div>

  <iframe id="print-frame" title="인쇄"></iframe>

  <script src="script.js"></script>
</body>
</html>
